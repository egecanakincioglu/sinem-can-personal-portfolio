name: ci

# Pull request title/description checks live in pr-text.yml (they also run on `edited`).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# The container images of the scanners, pinned by digest. A new version is a deliberate change of these values.
env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  SEMGREP_IMAGE: semgrep/semgrep:1.182.1@sha256:451b3d875c00dac7ed5db5293e584a07de11449a409c10b3c2d2652f429630b6
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9

jobs:
  # All merge-rule checks in one job. Every step runs even when an earlier one failed, so a single run reports
  # every violation. Dependabot commits can not follow our branch/message conventions, so those steps are
  # skipped for it; the rest runs for everyone.
  policy:
    name: policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Branch name
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: tooling/scripts/check-branch-name.sh "$HEAD_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
      - name: Validate every commit message in the pull request
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            msg="$(git log -1 --format=%B "$sha")"
            if ! printf '%s\n' "$msg" | tooling/scripts/check-commit-msg.sh -; then
              echo "::error::invalid commit message in $sha"
              status=1
            fi
          done
          exit $status
      # A stolen device or token can not forge the owner's commits. Runs for everyone, including Dependabot
      # (GitHub signs those commits itself).
      - name: Every commit in the pull request is verified by GitHub
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/scripts/check-signed-commits.ts
      - name: Source changes come with tests
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/scripts/check-untested-code.ts --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Coverage thresholds only go up
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/scripts/check-coverage-thresholds.ts --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Site audit thresholds only tighten
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/scripts/check-site-audit-thresholds.ts --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Version bumps come with a changelog entry and only go up
        if: ${{ !cancelled() && github.event.pull_request.user.login != 'dependabot[bot]' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tooling/scripts/check-release-version.ts --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Doc links
        if: ${{ !cancelled() }}
        run: node tooling/scripts/check-doc-links.ts
      - name: Commands quoted in the docs exist
        if: ${{ !cancelled() }}
        run: node tooling/scripts/check-doc-commands.ts
      - name: Docs are English and have ASCII kebab-case names
        if: ${{ !cancelled() }}
        run: node tooling/scripts/check-docs-language.ts
      - name: packageManager is pinned to an exact version with a hash
        if: ${{ !cancelled() }}
        run: node tooling/scripts/check-package-manager.ts
      - name: Scan tracked paths for forbidden files
        if: ${{ !cancelled() }}
        run: tooling/scripts/check-forbidden-paths.sh --all
      - name: Scan full history for leaked secrets
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" git /repo --redact --verbose

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      # Every step runs even when an earlier one failed, so one run reports every violation.
      - name: Type check
        run: pnpm typecheck
      - name: Format check
        if: ${{ !cancelled() }}
        run: pnpm format:check
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint
      - name: Semgrep rule tests
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep --test --metrics=off tooling/semgrep
      - name: Semgrep scan
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan --config tooling/semgrep --exclude tooling/semgrep --exclude src/generated --error --metrics=off
      - name: Dependency audit
        if: ${{ !cancelled() }}
        run: node tooling/scripts/check-audit.ts
      - name: Production licenses
        if: ${{ !cancelled() }}
        run: node tooling/scripts/check-licenses.ts
      - name: Dead code and unused dependencies
        if: ${{ !cancelled() }}
        run: pnpm knip

  # The community rulesets of the Semgrep registry. The tool is pinned by digest, the rules are not: the registry
  # serves its current version at run time, so a new rule can turn this job red without a change in the repository.
  # Kept apart from `quality` so that such a failure is easy to tell from a failure of our own checks.
  semgrep-registry:
    name: semgrep-registry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Semgrep registry scan
        run: |
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" semgrep scan --config p/typescript --config p/react --config p/nodejs --config p/owasp-top-ten --config p/security-audit --exclude tooling/semgrep --exclude src/generated --error --metrics=off

  # Audits the workflow files for security problems. Medium severity and above fail.
  # The online audits (impostor commits, known vulnerable actions) call the GitHub API with the job's read-only token.
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" -w /repo "$ZIZMOR_IMAGE" --no-progress --min-severity medium .github

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Tests with coverage
        run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing to build or audit until the site is merged; this step and its `if` conditions go away then.
      - name: Detect the site
        id: site
        run: |
          if [ -f 'src/app/[locale]/page.tsx' ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "The site is not in the repository yet; the remaining steps are skipped."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.site.outputs.present == 'true'
        with:
          node-version-file: .node-version
      - name: Install dependencies
        if: steps.site.outputs.present == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build
        if: steps.site.outputs.present == 'true'
        run: pnpm build

  site-audit:
    name: site-audit (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: 1
    strategy:
      fail-fast: false
      matrix:
        leg: [pages, mobile, desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Nothing to build or audit until the site is merged; this step and its `if` conditions go away then.
      - name: Detect the site
        id: site
        run: |
          if [ -f 'src/app/[locale]/page.tsx' ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "The site is not in the repository yet; the remaining steps are skipped."
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.site.outputs.present == 'true'
        with:
          node-version-file: .node-version
      - name: Install dependencies
        if: steps.site.outputs.present == 'true'
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Build
        if: steps.site.outputs.present == 'true'
        run: pnpm build
      - name: Site audit
        if: steps.site.outputs.present == 'true'
        run: pnpm site-audit --leg ${{ matrix.leg }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.site.outputs.present == 'true'
        with:
          name: site-audit-${{ matrix.leg }}
          path: site-audit-report
          retention-days: 7

  tooling-linux:
    name: tooling (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Some tooling checks parse sources with the TypeScript compiler.
      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Unit tests of the tooling
        run: node --test "tooling/**/*.test.ts"
      # Syntax check of every shell script.
      - name: Shell syntax
        run: |
          set -euo pipefail
          find tooling -name '*.sh' | while IFS= read -r f; do
            bash -n "$f"
          done

  tooling-windows:
    name: tooling (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # Git Bash on the runner, the same shell the tooling targets on a developer's Windows machine.
      - name: Install dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Unit tests of the tooling
        shell: bash
        run: node --test "tooling/**/*.test.ts"
