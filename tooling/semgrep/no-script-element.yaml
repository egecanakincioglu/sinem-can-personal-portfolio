rules:
  - id: no-script-element
    languages: [typescript]
    severity: ERROR
    message: A JSX script element is allowed only in src/components/json-ld.tsx, or with its content given solely through dangerouslySetInnerHTML (optionally with a type attribute).
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: <script ... />
              - pattern: <script ...>...</script>
          - pattern-not: <script dangerouslySetInnerHTML={...} />
          - pattern-not: <script dangerouslySetInnerHTML={...}></script>
          - pattern-not: <script type=... dangerouslySetInnerHTML={...} />
          - pattern-not: <script type=... dangerouslySetInnerHTML={...}></script>
          - pattern-not: <script dangerouslySetInnerHTML={...} type=... />
          - pattern-not: <script dangerouslySetInnerHTML={...} type=... ></script>
      - pattern: <script src=... ... />
      - pattern: <script src=... ...>...</script>
      - pattern: <script ...>$CHILD</script>
    paths:
      exclude:
        - src/components/json-ld.tsx
